<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe · 黑洞初版</title>
<style>
:root{color-scheme:dark;font:14px/1.6 system-ui;background:#0c111a;color:#cfd5dc}body{margin:0}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.panel{position:fixed;bottom:20px;left:20px;padding:18px 22px;background:#111720e8;border:1px solid #eef2f514;border-radius:14px;max-width:400px}h1{font-size:18px;margin:0 0 8px}label{display:block;margin:6px 0}input{vertical-align:middle}button{background:#1e252f;color:inherit;border:1px solid #eef2f526;padding:7px 12px;border-radius:7px;cursor:pointer}output{font-variant-numeric:tabular-nums}#stats{font:12px/1.6 monospace;white-space:pre-wrap}.sample{position:fixed;right:24px;top:24px;max-width:330px;padding:22px;background:#171e27ed;border:1px solid #eef2f514;border-radius:12px}.light{color-scheme:light;background:#eff2f5;color:#1c242b}.light .panel{background:#f9fafce8;border-color:#1117201a}button:hover{filter:brightness(1.15)}.light .sample{background:#f9fafcf5;color:#1c242b;border-color:#11172014}.light button{background:#e8ecf1;border-color:#11172026}.clean .panel,.clean .sample{display:none}@media(max-width:700px){.sample{display:none}.panel{bottom:10px;left:10px;right:10px}}
</style>
<canvas aria-hidden="true"></canvas>
<aside class="sample"><strong>主题可读性试片</strong><p>黑洞是暗影，不是发光球。背景不抢占输入、选择与滚动。</p><p>这只是预览试片，不代表 DSH 真机验收。</p></aside>
<section class="panel"><h1>Universe · ASCII 黑洞初版</h1><div>视线相对盘面仰角；相对盘法线为 <span id="normalAngle">60</span>°。</div><label>仰角 <input id="angle" type="range" min="25" max="35" value="30" step="1"> <output id="angleValue">30°</output></label><label>亮度 <input id="brightness" type="range" min=".15" max="2" step=".05" value="1"></label><button id="pause">暂停</button> <button id="theme">明暗试片</button><p id="stats">构建字符光路中</p><small>几何光路近似 + 程序化发射；非 Kerr / GRMHD 模拟。</small></section>
<script src="../src/runtime/black-hole.js"></script><script>
var renderer, paused=false;
try { renderer=UniverseBlackHole.create(document.querySelector('canvas')); window.blackHole=renderer;
document.querySelector('#angle').oninput=function(e){renderer.update({angle:+e.target.value});document.querySelector('#angleValue').textContent=e.target.value+'°';document.querySelector('#normalAngle').textContent=90-e.target.value;};
document.querySelector('#brightness').oninput=function(e){renderer.update({brightness:+e.target.value});};
document.querySelector('#pause').onclick=function(e){paused=!paused;renderer.update({speed:paused?0:1});e.target.textContent=paused?'继续':'暂停';};
document.querySelector('#theme').onclick=function(){document.body.classList.toggle('light');renderer.setMode(document.body.classList.contains('light')?'light':'dark');};
if(new URLSearchParams(location.search).has('clean'))document.body.classList.add('clean');
setInterval(function(){var s=renderer.stats();document.querySelector('#stats').textContent=s.columns+' × '+s.rows+' 字符 · '+s.frames+' 帧\n字符绘制均值 '+s.meanPaintMs.toFixed(2)+' ms（非合成耗时）';},1000);
window.addEventListener('pagehide',function(){renderer.dispose();},{once:true});
} catch(e){document.querySelector('#stats').textContent='Canvas 2D 不可用：'+e.message;}
</script></html>
